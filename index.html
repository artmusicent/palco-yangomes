<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapa de Palco 3D · Yan Gomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#f2b21b; --blue:#3aa8ff; --bg:#070708; --panel:rgba(12,12,14,.84); --line:rgba(255,255,255,.14); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:#fff; overflow:hidden;
    font-family:Inter,"Helvetica Neue",Arial,sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas#gl{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#gl.drag{ cursor:grabbing; }
  #lines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #lines line{ stroke:var(--gold); stroke-width:1; stroke-dasharray:3 3; opacity:.75; }
  #labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lb{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); white-space:nowrap; text-align:center;
    background:var(--panel); border:1px solid var(--gold); border-radius:6px; padding:6px 11px 7px;
    font-size:11.5px; font-weight:600; letter-spacing:.04em; line-height:1.35; text-transform:uppercase;
    will-change:transform; }
  .lb b{ display:block; color:var(--gold); font-family:Oswald,Impact,"Arial Narrow",sans-serif; font-weight:600;
    font-size:15px; letter-spacing:.06em; }
  .lb span{ display:block; }
  .lb i{ font-style:normal; color:var(--blue); }
  .lb.sm{ border-color:rgba(255,255,255,.35); font-size:9.5px; padding:4px 8px; color:#e9e9ec; }
  .lb.sm em{ font-style:normal; color:var(--gold); }
  .hide-labels #labels, .hide-labels #lines{ display:none; }

  header{ position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:14px;
    padding:14px 18px; pointer-events:none;
    background:linear-gradient(180deg, rgba(7,7,8,.92), rgba(7,7,8,0)); }
  header img{ height:58px; width:auto; display:block; }
  header .t{ display:flex; flex-direction:column; gap:2px; }
  header h1{ margin:0; font-family:Oswald,Impact,"Arial Narrow",sans-serif; font-weight:700; font-size:26px;
    letter-spacing:.05em; line-height:1; }
  header h1 s{ text-decoration:none; color:var(--gold); }
  header p{ margin:0; font-size:10.5px; font-weight:600; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
  header .note{ margin-left:auto; text-align:right; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.55); line-height:1.5; }

  #bottom{ position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center;
    background:linear-gradient(0deg, rgba(7,7,8,.95) 45%, rgba(7,7,8,0)); padding-top:26px; }
  #bar{ display:flex; gap:6px; max-width:100%; overflow-x:auto; padding:6px 12px 10px; scrollbar-width:none; }
  #bar::-webkit-scrollbar{ display:none; }
  #bar .sep{ flex:0 0 1px; background:var(--line); margin:4px 4px; }
  button{ flex:0 0 auto; font:inherit; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:#fff; background:rgba(22,22,25,.92); border:1px solid var(--line); border-radius:7px;
    padding:10px 14px; cursor:pointer; }
  button:hover{ border-color:rgba(255,255,255,.4); }
  button.on{ background:var(--gold); border-color:var(--gold); color:#0a0a0a; }
  footer{ width:100%; display:flex; align-items:center; gap:12px; padding:7px 18px 9px;
    border-top:1px solid var(--line); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.55); }
  footer img{ height:20px; width:auto; display:block; }
  footer .hint{ margin-left:auto; text-align:right; }
  #err{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:30px;
    text-align:center; font-size:14px; color:#ddd; }

  @media (max-width:640px){
    header{ padding:10px 12px; gap:10px; }
    header img{ height:42px; }
    header h1{ font-size:19px; }
    header p{ font-size:8.5px; letter-spacing:.16em; }
    header .note{ display:none; }
    .lb{ font-size:8.5px; padding:4px 7px 5px; border-radius:5px; }
    .lb b{ font-size:11.5px; }
    .lb.sm{ font-size:7.5px; padding:3px 5px; }
    #bar{ justify-content:flex-start; width:100%; }
    button{ padding:10px 12px; font-size:10px; }
    footer{ padding:6px 12px 8px; font-size:8px; }
    footer img{ height:16px; }
  }
</style>
</head>

function quadN(a,b,c,d,n,col,e){pv(a,n,col,e);pv(b,n,col,e);pv(c,n,col,e);pv(a,n,col,e);pv(c,n,col,e);pv(d,n,col,e);}
function rot(v,o){var x=v[0],y=v[1],z=v[2],c,s,t;
  if(o.rz){c=Math.cos(o.rz);s=Math.sin(o.rz);t=x*c-y*s;y=x*s+y*c;x=t;}
  if(o.rx){c=Math.cos(o.rx);s=Math.sin(o.rx);t=y*c-z*s;z=y*s+z*c;y=t;}
  if(o.ry){c=Math.cos(o.ry);s=Math.sin(o.ry);t=x*c+z*s;z=-x*s+z*c;x=t;}
  return [x,y,z];}
function box(cx,cy,cz,sx,sy,sz,hex,o){o=o||{};var col=rgb(hex),h=[sx/2,sy/2,sz/2],C=[cx,cy,cz];
  for(var i=0;i<3;i++)for(var sg=-1;sg<=1;sg+=2){
    var j=(i+1)%3,k=(i+2)%3,n=[0,0,0];n[i]=sg;var ring=[[-1,-1],[1,-1],[1,1],[-1,1]],pts=[];

  for(var i=0;i<seg;i++){var d0=dir(i),d1=dir(i+1);
    var A=add(p0,sc(d0,r0)),B=add(p0,sc(d1,r0)),C=add(p1,sc(d1,r1)),D=add(p1,sc(d0,r1));
    pv(A,d0,col,o.e);pv(B,d1,col,o.e);pv(C,d1,col,o.e);pv(A,d0,col,o.e);pv(C,d1,col,o.e);pv(D,d0,col,o.e);
    if(!o.open){var na=sc(a,-1);pv(p0,na,col,o.e);pv(B,na,col,o.e);pv(A,na,col,o.e);pv(p1,a,col,o.e);pv(D,a,col,o.e);pv(C,a,col,o.e);}
  }}
function sph(c,r,hex,o){o=o||{};var col=rgb(hex),la=o.la||8,lo=o.lo||12,S=o.s||[1,1,1];
  function P(i,j){var t=i/la*Math.PI,f=j/lo*Math.PI*2,n=[Math.sin(t)*Math.cos(f),Math.cos(t),Math.sin(t)*Math.sin(f)];
    return {n:n,p:[c[0]+n[0]*r*S[0],c[1]+n[1]*r*S[1],c[2]+n[2]*r*S[2]]};}
  for(var i=0;i<la;i++)for(var j=0;j<lo;j++){var a=P(i,j),b=P(i+1,j),d=P(i+1,j+1),e=P(i,j+1);
    pv(a.p,a.n,col,o.e);pv(b.p,b.n,col,o.e);pv(d.p,d.n,col,o.e);pv(a.p,a.n,col,o.e);pv(d.p,d.n,col,o.e);pv(e.p,e.n,col,o.e);}}

var tFloor=texFrom(fc), tShadow=texFrom(radial('rgba(0,0,0,.7)','rgba(0,0,0,0)')), tPool=texFrom(radial('rgba(255,255,255,.55)','rgba(255,255,255,0)'));
floorQuad(tFloor,0,(ZB+ZF)/2,SW/2,(ZF-ZB)/2,0.003,[1,1,1,1]);
[[0,-2.02,.5],[0,1.2,.5],[2.3,.3,.5],[0,-1.3,1.7],[-2.3,2,.5],[2.3,2,.5],[2.45,1.15,.55]].forEach(function(s){
  floorQuad(tShadow,s[0],s[1],s[2],s[2]*(s[0]===0&&s[1]===-1.3?0.5:1),0.006,[1,1,1,1]);});
var POOL=[];
MX.forEach(function(){var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(30),gl.DYNAMIC_DRAW);
  var q={b:b,t:tPool,tint:[1,1,1,0.26],show:1};TQ.push(q);POOL.push(q);});

// logo na rotunda (carrega depois)
var logoImg=document.getElementById('logo');
function addLogo(){ if(!logoImg.naturalWidth)return; var t=texFrom(logoImg),w=3.3,h=w*logoImg.naturalHeight/logoImg.naturalWidth,y=2.5,z=ZB+0.0;
  tquad(t,[[-w/2,y-h/2,z],[w/2,y-h/2,z],[w/2,y+h/2,z],[-w/2,y+h/2,z]],[1,1,1,0.92],2);
  var w2=0.98,h2=w2*logoImg.naturalHeight/logoImg.naturalWidth,y2=0.44,z2=-0.868;   // toalha da mesa do DJ
  tquad(t,[[-w2/2,y2-h2/2,z2],[w2/2,y2-h2/2,z2],[w2/2,y2+h2/2,z2],[-w2/2,y2+h2/2,z2]],[1,1,1,0.96],3); }
if(logoImg.complete)addLogo();else logoImg.addEventListener('load',addLogo);

// fachos de luz (moving heads em movimento + PAR LED), recalculados a cada quadro
var BSEG=18, NBEAM=MX.length+PX.length, NBV=NBEAM*BSEG*9, BA=new Float32Array(NBV*7);
var bb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bb);gl.bufferData(gl.ARRAY_BUFFER,BA,gl.DYNAMIC_DRAW);
var PAL=[[1,.72,.2],[1,.2,.65],[.3,.45,1],[.2,.9,1],[1,.25,.15]];
function colAt(u){var k=Math.floor(u),f=u-k;f=f*f*(3-2*f);var a=PAL[((k%5)+5)%5],b=PAL[(((k+1)%5)+5)%5];
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
function fillBeam(o,a,b,r0,r1,c,a0,a1){var ax=norm(sub(b,a)),u=norm(cross(ax,[1,0,0.2])),v=cross(ax,u);
  function put(p,al){BA[o++]=p[0];BA[o++]=p[1];BA[o++]=p[2];BA[o++]=c[0];BA[o++]=c[1];BA[o++]=c[2];BA[o++]=al;}
  for(var i=0;i<BSEG;i++){var t0=i/BSEG*6.2832,t1=(i+1)/BSEG*6.2832;
    var d0=add(sc(u,Math.cos(t0)),sc(v,Math.sin(t0))),d1=add(sc(u,Math.cos(t1)),sc(v,Math.sin(t1)));
    var A=add(a,sc(d0,r0)),A1=add(a,sc(d1,r0)),C=add(b,sc(d1,r1)),D=add(b,sc(d0,r1));
    put(A,a0);put(A1,a0);put(C,a1);put(A,a0);put(C,a1);put(D,a1);put(a,.9);put(A,.9);put(A1,.9);}
  return o;}
var MOV=[];   // estado atual dos movings: alvo no piso + cor
function updateRig(T){var o=0,i;MOV.length=0;
  for(i=0;i<MX.length;i++){var ph=i*1.7,x=MX[i];
    var tg=[x*0.75+1.5*Math.sin(T*0.55+ph),0,0.5+1.5*Math.sin(T*0.41+ph*1.3)],c=colAt(T*0.2+i*1.25);
    MOV.push({t:tg,c:c});
    o=fillBeam(o,[x,TY-0.5,TZ],tg,0.09,0.8,c,0.24,0.015);
    var r=1.15,y=0.009,q=POOL[i];q.tint=[c[0],c[1],c[2],0.26];
    gl.bindBuffer(gl.ARRAY_BUFFER,q.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,new Float32Array([tg[0]-r,y,tg[2]+r,0,0, tg[0]+r,y,tg[2]+r,1,0, tg[0]+r,y,tg[2]-r,1,1, tg[0]-r,y,tg[2]+r,0,0, tg[0]+r,y,tg[2]-r,1,1, tg[0]-r,y,tg[2]-r,0,1]));}
  for(i=0;i<PX.length;i++){var px=PX[i],pc=colAt(T*0.11+(i%2)*2.5+1.2);
    o=fillBeam(o,[px,TY-0.31,TZ+0.08],[px*0.92,0,-0.5],0.11,1.35,pc,0.13,0.0);}
  gl.bindBuffer(gl.ARRAY_BUFFER,bb);gl.bufferSubData(gl.ARRAY_BUFFER,0,BA);}

/* ============ CÂMERA ============ */
var CAMS={
  pub:  {az:0,       el:0.36, elP:0.6, k:14.4, dmin:13.4, t:[0,1.15,0.3]},
  top:  {az:0,       el:1.5,  k:14.5, dmin:14.2, t:[0,0,0.25]},
  lat:  {az:1.12,    el:0.32, k:12.5, dmin:12, t:[0,0.7,0]},
  palco:{az:Math.PI, el:0.42, k:14.4, dmin:12.2, t:[0,0.7,0]}
};
var cam={az:0,el:0.19,d:12,t:[0,1.15,0]}, goal={az:0,el:0.19,d:12,t:[0,1.15,0]};
var W=1,H=1,DPR=1,curCam='pub',spin=false,show=true,showK=1;
function fitDist(c){var asp=W/H;return Math.max(c.dmin,c.k/asp);}
function setCam(name,snap){curCam=name;var c=CAMS[name];goal.az=c.az;goal.el=(W<H&&c.elP)?c.elP:c.el;goal.d=fitDist(c);goal.t=c.t.slice();
  // caminho mais curto na rotação
  while(goal.az-cam.az>Math.PI)goal.az-=2*Math.PI;while(goal.az-cam.az<-Math.PI)goal.az+=2*Math.PI;
  if(snap){cam.az=goal.az;cam.el=goal.el;cam.d=goal.d;cam.t=goal.t.slice();}
  [].forEach.call(document.querySelectorAll('[data-cam]'),function(b){b.classList.toggle('on',b.dataset.cam===name);});}
function clearCamBtn(){curCam=null;[].forEach.call(document.querySelectorAll('[data-cam]'),function(b){b.classList.remove('on');});}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth||1;H=cv.clientHeight||1;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  document.getElementById('lines').setAttribute('viewBox','0 0 '+W+' '+H);
  if(curCam)goal.d=fitDist(CAMS[curCam]);}
window.addEventListener('resize',resize);

/* ---------- entrada ---------- */
var pts={},pinch=0;
function clampGoal(){goal.el=Math.max(0.03,Math.min(1.5,goal.el));goal.d=Math.max(3,Math.min(48,goal.d));}
function pan(dx,dy){var s=goal.d*0.0013,ca=Math.cos(goal.az),sa=Math.sin(goal.az);
  goal.t[0]-=dx*s*ca;goal.t[2]+=dx*s*sa;goal.t[1]+=dy*s;goal.t[1]=Math.max(-0.5,Math.min(4,goal.t[1]));
  goal.t[0]=Math.max(-5,Math.min(5,goal.t[0]));goal.t[2]=Math.max(-5,Math.min(5,goal.t[2]));}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY,b:e.button};cv.classList.add('drag');pinch=0;stopSpin();});
cv.addEventListener('pointermove',function(e){var p=pts[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  var ids=Object.keys(pts);
  if(ids.length>=2){var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch>0){goal.d*=pinch/d;} pinch=d; pan(dx*0.5,dy*0.5);}
  else if(p.b===2||e.shiftKey){pan(dx,dy);}
  else{goal.az-=dx*0.006;goal.el+=dy*0.005;}
  clampGoal();clearCamBtn();});
function up(e){delete pts[e.pointerId];pinch=0;if(!Object.keys(pts).length)cv.classList.remove('drag');}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();goal.d*=Math.exp(e.deltaY*0.0012);clampGoal();clearCamBtn();stopSpin();},{passive:false});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

var bGirar=document.getElementById('bGirar'),bLuz=document.getElementById('bLuz'),bLeg=document.getElementById('bLeg');
function stopSpin(){spin=false;bGirar.classList.remove('on');}
[].forEach.call(document.querySelectorAll('[data-cam]'),function(b){b.addEventListener('click',function(){stopSpin();setCam(b.dataset.cam);});});
bGirar.addEventListener('click',function(){spin=!spin;bGirar.classList.toggle('on',spin);if(spin){clearCamBtn();goal.el=Math.max(goal.el,0.22);}});
bLuz.addEventListener('click',function(){show=!show;bLuz.classList.toggle('on',show);});
bLeg.addEventListener('click',function(){var h=document.getElementById('app').classList.toggle('hide-labels');bLeg.classList.toggle('on',!h);});
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)document.getElementById('hint').textContent='Arraste para girar · Pinça para zoom';

/* ---------- legendas ---------- */
var LB=document.getElementById('labels'),LN=document.getElementById('lines');
LABELS.forEach(function(l){l.el=document.createElement('div');l.el.className='lb'+(l.sm?' sm':'');l.el.innerHTML=l.html;LB.appendChild(l.el);
  l.ln=document.createElementNS('http://www.w3.org/2000/svg','line');LN.appendChild(l.ln);});
function measure(){LABELS.forEach(function(l){l.w=l.el.offsetWidth;l.h=l.el.offsetHeight;});}
measure();window.addEventListener('resize',measure);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);setTimeout(measure,1500);
function proj(m,p){var x=m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],y=m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
  if(w<=0.01)return null;return [(x/w*0.5+0.5)*W,(1-(y/w*0.5+0.5))*H];}

/* ============ RENDER ============ */
function attr(p,name,size,stride,off){var l=gl.getAttribLocation(p,name);if(l<0)return;gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,stride,off);}
var last=0;
function frame(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  if(spin)goal.az+=dt*0.28;
  var k=1-Math.pow(0.0015,dt);
  cam.az+=(goal.az-cam.az)*k;cam.el+=(goal.el-cam.el)*k;cam.d+=(goal.d-cam.d)*k;
  for(var i=0;i<3;i++)cam.t[i]+=(goal.t[i]-cam.t[i])*k;
  showK+=((show?1:0)-showK)*Math.min(1,dt*5);
  updateRig(ts/1000);

  var ce=Math.cos(cam.el),eye=[cam.t[0]+cam.d*Math.sin(cam.az)*ce,cam.t[1]+cam.d*Math.sin(cam.el),cam.t[2]+cam.d*Math.cos(cam.az)*ce];
  var VP=mul(persp(0.66,W/H,0.2,140),lookAt(eye,cam.t,[0,1,0]));

  gl.viewport(0,0,cv.width,cv.height);gl.clearColor(BG[0],BG[1],BG[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);gl.depthMask(true);

  gl.useProgram(P1);gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  attr(P1,'aP',3,40,0);attr(P1,'aN',3,40,12);attr(P1,'aC',3,40,24);attr(P1,'aE',1,40,36);
  gl.uniformMatrix4fv(gl.getUniformLocation(P1,'uVP'),false,VP);
  gl.uniform3fv(gl.getUniformLocation(P1,'uEye'),eye);gl.uniform3fv(gl.getUniformLocation(P1,'uBG'),BG);
  gl.uniform1f(gl.getUniformLocation(P1,'uAmb'),1.25-0.6*showK);gl.uniform1f(gl.getUniformLocation(P1,'uKey'),1.15-0.45*showK);
  var s=showK,LPp=[0,3.6,4.2],LCc=[2.3*s,2.0*s,1.3*s];
  [0,1,3].forEach(function(i){var m=MOV[i];LPp.push(m.t[0],2.4,m.t[2]);LCc.push(m.c[0]*2.6*s,m.c[1]*2.6*s,m.c[2]*2.6*s);});
  gl.uniform3fv(gl.getUniformLocation(P1,'uLP'),LPp);gl.uniform3fv(gl.getUniformLocation(P1,'uLC'),LCc);
  var back=eye[2]<ZB+0.6;   // câmera atrás da rotunda: esconde o fundo
  gl.drawArrays(gl.TRIANGLES,0,R0);gl.drawArrays(gl.TRIANGLES,R1,NV-R1);if(!back)gl.drawArrays(gl.TRIANGLES,R0,R1-R0);

  gl.enable(gl.BLEND);gl.depthMask(false);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P2);gl.uniformMatrix4fv(gl.getUniformLocation(P2,'uVP'),false,VP);gl.uniform1i(gl.getUniformLocation(P2,'uT'),0);
  var br=0.62+0.38*(1-showK);
  TQ.forEach(function(q){var a=q.tint[3];if(q.show===2&&back)return;if(q.show===1){a*=showK;if(a<0.003)return;gl.blendFunc(gl.SRC_ALPHA,gl.ONE);}else gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    var m=q.show===0&&q.t===tFloor?(0.85+0.5*(1-showK)):1;
    gl.bindBuffer(gl.ARRAY_BUFFER,q.b);attr(P2,'aP',3,20,0);attr(P2,'aU',2,20,12);gl.bindTexture(gl.TEXTURE_2D,q.t);
    gl.uniform4f(gl.getUniformLocation(P2,'uTint'),q.tint[0]*m,q.tint[1]*m,q.tint[2]*m,a);gl.drawArrays(gl.TRIANGLES,0,6);});

  if(showK>0.01){gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.useProgram(P3);gl.bindBuffer(gl.ARRAY_BUFFER,bb);
    attr(P3,'aP',3,28,0);attr(P3,'aC',4,28,12);gl.uniformMatrix4fv(gl.getUniformLocation(P3,'uVP'),false,VP);
    gl.uniform1f(gl.getUniformLocation(P3,'uK'),showK*Math.max(0,Math.min(1,1.7-1.25*cam.el)));gl.drawArrays(gl.TRIANGLES,0,NBV);}
  gl.depthMask(true);

  var placed=[];
  for(var j=0;j<LABELS.length;j++){var l=LABELS[j],a=proj(VP,l.at),b=proj(VP,l.pos);
    if(!a||!b){l.el.style.display='none';l.ln.style.display='none';continue;}
    l.el.style.display='';l.ln.style.display='';
    if(l.an==='b')b[1]-=l.h/2+2;else if(l.an==='t')b[1]+=l.h/2+2;
    for(var t=0,dir=0,hz=0;t<6;t++){var hit=null;
      for(var q=0;q<placed.length;q++){var o=placed[q];
        if(Math.abs(b[0]-o.x)<(l.w+o.w)/2+4&&Math.abs(b[1]-o.y)<(l.h+o.h)/2+4){hit=o;break;}}
      if(!hit)break;
      if(!hz){hz=1;var nx=b[0]<hit.x?hit.x-(hit.w+l.w)/2-6:hit.x+(hit.w+l.w)/2+6;
        if(Math.abs(nx-b[0])<l.w*1.4&&nx-l.w/2>3&&nx+l.w/2<W-3){b[0]=nx;continue;}}
      var upY=hit.y-(hit.h+l.h)/2-5,dnY=hit.y+(hit.h+l.h)/2+5;
      if(!dir)dir=l.an==='b'?-1:l.an==='t'?1:(Math.abs(upY-b[1])<=Math.abs(dnY-b[1]))?-1:1;
      b[1]=dir<0?upY:dnY;}
    placed.push({x:b[0],y:b[1],w:l.w,h:l.h});
    l.el.style.transform='translate(-50%,-50%) translate('+b[0].toFixed(1)+'px,'+b[1].toFixed(1)+'px)';
    l.ln.setAttribute('x1',a[0]);l.ln.setAttribute('y1',a[1]);l.ln.setAttribute('x2',b[0]);l.ln.setAttribute('y2',b[1]);}
  requestAnimationFrame(frame);
}
resize();setCam('pub',true);requestAnimationFrame(frame);
window.__setCam=function(n){setCam(n,true);};
})();
</script>
